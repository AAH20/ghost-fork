[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-fork"
version = "0.1.0"
description = "In-Memory Copy-on-Write (CoW) Virtual Filesystem & Atomic Rollback Engine for Autonomous AI Coding Agents (Aider / OpenHands / Claude Code)"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
# No third-party runtime dependencies: vfs.py uses only os/dataclasses/
# typing from the standard library. An earlier version of this file listed
# pydantic and typing_extensions here; neither was ever imported anywhere
# in the codebase.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
